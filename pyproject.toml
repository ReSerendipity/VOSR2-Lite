[project]
name = "vosr2-lite"
version = "0.1.0"
description = "基于 VOSR2 扩散模型的独立图像超分辨率工具箱（FastAPI + Web UI，无需 ComfyUI）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ReSerendipity" }]
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "diffusers>=0.35.0",
    "accelerate>=1.1.0",
    "einops>=0.8.0",
    "safetensors>=0.4.4",
    "timm>=1.0.11",
    "fairscale>=0.4.13",
    "numpy>=1.26.4,<2.3",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.0",
    "PyYAML>=6.0.2",
    "loguru>=0.7.3",
    "tqdm>=4.66.4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "black>=24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vosr", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ── 覆盖率门禁 ──────────────────────────────────────────────────────────────
# 2026-10-28 建立时基线 67.61%（1873 语句）；补完 API 与安全中间件测试后升到
# 70.60%（2119 语句），阈值随之从 65 棘轮到 68。
# 规则：只升不降——补测试后把 fail_under 同步上调，禁止为过门禁而下调。
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 68
precision = 1
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# vosr/ 为上游 cswry/VOSR 的 vendor 代码（Apache-2.0，原样保留，见 UPSTREAM.md），
# 不参与本项目 lint；自有代码才受约束。
extend-exclude = ["vosr"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

# ── 类型与格式门禁（2026-10-28 建立，0 容忍）───────────────────────────────
# vosr/ 为上游 cswry/VOSR 的 vendor 代码，与 ruff 同口径不参与门禁。
[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]
exclude = ["^vosr/"]
ignore_missing_imports = true
follow_imports = "silent" # 不检查 vendor 内部，但仍取其类型信息
no_implicit_optional = true
show_error_codes = true
warn_unused_ignores = false
warn_redundant_casts = true

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
    \.venv
  | vosr
  | model
  | data
  | outputs
  | logs
  | build
  | dist
)/
'''
