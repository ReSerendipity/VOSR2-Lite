server:
  host: 127.0.0.1
  port: 7871
  auto_open_browser: true
  debug: false
  allowed_origins:
  - http://127.0.0.1:7871
  - http://localhost:7871
model:
  # 权重根目录（布局对齐上游 preset/ckpts/）
  pretrained_dir: model
  # 默认加载的 checkpoint 目录名（model/ 下）
  default_checkpoint: VOSR2
  # 启动时是否自动加载模型（false = 首次请求时懒加载）
  auto_load: false
  # 空闲自动卸载分钟数（0 = 从不卸载）
  idle_unload_minutes: 15
  # device: auto | cuda | cpu
  device: auto
  checkpoints:
    VOSR2:
      name: VOSR 2.0 (1.4B one-step)
      type: onestep
      ae_type: qwen
      min_vram_gb: 8
      default_steps: 1
    VOSR_1.4B_os:
      name: VOSR-1.4B one-step (distilled)
      type: onestep
      ae_type: qwen
      min_vram_gb: 8
      default_steps: 1
    VOSR_1.4B_ms:
      name: VOSR-1.4B multi-step
      type: multistep
      ae_type: qwen
      min_vram_gb: 8
      default_steps: 25
    VOSR_0.5B_os:
      name: VOSR-0.5B one-step (distilled)
      type: onestep
      ae_type: sd2
      min_vram_gb: 4
      default_steps: 1
    VOSR_0.5B_ms:
      name: VOSR-0.5B multi-step
      type: multistep
      ae_type: sd2
      min_vram_gb: 4
      default_steps: 25
inference:
  default_upscale: 4
  default_align_method: wavelet
  default_seed: 42
  default_steps: 1
  # 分块尺寸（0=自动：引擎按输出边长与可用显存决策，大图自动开分块防 OOM；
  # 2026-10-23 实测 3096² 全图 VAE 编码必爆 12GB 显存，已改自动分块）
  default_tile_size: 0
  tile_overlap: 32
  default_vae_tile_size: 0
  # 输出边长硬上限（像素）。超过直接报错并建议降低倍率，避免产生
  # 数小时且必然 OOM 的任务。
  max_output_side: 6144
  # 颜色对齐方式: wavelet | adain | nofix
  align_methods:
  - wavelet
  - adain
  - nofix
history:
  db_path: data/history.db
  max_records: 10000
i18n:
  available_locales:
  - zh
  - zh-TW
  - en
  default_locale: zh
logging:
  file: logs/app.log
  level: INFO
  max_size_mb: 50
  backup_count: 3
runtime:
  security:
    rate_limit_per_minute: 30
    max_upload_image_mb: 50
    allowed_base_dirs:
    - outputs/
    - data/uploads/
    - data/checkpoints/
    - model/
    # HTTP Basic Auth：默认关闭。绑到非回环地址（局域网/公网/容器端口映射）
    # 时务必开启，否则等于把 GPU 推理与上传接口完全开放（CWE-306）。
    # 密码建议用环境变量 VOSR2_AUTH_PASSWORD 注入，避免明文入库。
    auth:
      enable: false
      username: ""
      password: ""
      realm: VOSR2
      max_auth_failures: 5          # 窗口内失败次数上限（<=0 关闭防爆破）
      auth_failure_window_seconds: 300
      auth_ban_seconds: 600
    # CSRF（Double Submit Cookie）：默认关闭。对外暴露时建议开启；
    # 前端 app.js 已自动回传 X-CSRF-Token，开启后无需改前端。
    csrf:
      enable: false
  task:
    queue_maxsize: 100
    max_timeout_seconds: 86400
    progress_stall_timeout_minutes: 30
  sse:
    heartbeat_interval_seconds: 30
    max_duration_seconds: 3600
