version: 2
# 依赖更新策略（对齐家族仓 SeedVR2-Lite 的口径）。
#
# 冷却期（cooldown）：新版本发布后先等几天再生成 PR，避开"上游刚发布即升级"的
# 投毒窗口最窄时刻。安全补丁类更新不受冷却影响，仍即时生成 PR。
# default-days 不得低于 7（家族安全规则的下限）。
# 参考 https://docs.github.com/code-security/dependabot/dependabot-version-updates/optimizing-pr-creation-version-updates
updates:
  # Python 依赖（requirements.txt + pyproject.toml）
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      # minor/patch 合并成一个 PR（便于一次性回归）；major 仍各自单开 PR 逐个评审。
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
    ignore:
      # torch / torchvision 有严格配对关系（requirements.txt 锁 2.10.0 + 0.25.0），
      # 单独升级会得到不兼容组合；且 CUDA 轮子走 download.pytorch.org 独立索引，
      # Dependabot 默认索引拿不到。升级请手工改 requirements.txt 并跑真机冒烟。
      - dependency-name: "torch"
      - dependency-name: "torchvision"

  # GitHub Actions（钉 SHA 的 workflow 也需要知道有新版本）
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
