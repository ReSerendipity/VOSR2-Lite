# 密钥扫描：全历史 gitleaks 检测，防真实密钥（API key / token / 私钥）进仓库。
#
# 为什么需要：本仓有 download_model.py（涉及 HF/ModelScope token）、
# Basic Auth 密码、CSRF 签名密钥三条"凭据会出现在配置里"的路径，
# 一旦误把真实值写进 config.yaml 或脚本，仅靠 review 很难拦住。
#
# 触发：push/PR 到 main、每周日全历史兜底、手动。
name: Secret Scan (gitleaks)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 1 * * 0" # 每周日 01:00 UTC 全量历史扫描
  workflow_dispatch:

permissions:
  contents: read

env:
  # gitleaks 版本升级维护：只改这一处
  GITLEAKS_VERSION: "8.30.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  gitleaks:
    name: Secret Scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run gitleaks scan
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks
          # --redact 保证报告不输出真实密钥；发现泄露时 gitleaks 以非零码退出，流程失败即门禁
          ./gitleaks detect --source . --redact --config gitleaks.toml \
            --report-format json --report-path gitleaks-report.json

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
