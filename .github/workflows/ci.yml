name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch (smaller, sufficient for unit tests)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest tests/ -v

      # 覆盖率门禁：阈值在 pyproject.toml [tool.coverage.report] fail_under，
      # 低于阈值 pytest 退出码非 0（2026-10-28 基线 68%，门禁 65%）。
      - name: Coverage gate
        run: pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml
