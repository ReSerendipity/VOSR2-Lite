# 仓库布局守卫：目录/模块被误移误删、本地产物或密钥混进版本库时立刻失败。
#
# 检查逻辑在 scripts/check_layout.py（可本地直接跑）：
#   1. 必需路径存在（顶层入口 + 应用骨架 + 拆分后的引擎子模块 + 脚本/测试）
#   2. 本地产物被 .gitignore 忽略（用 git check-ignore 探测真实路径）
#   3. 禁入文件未入库（密钥 / 模型权重 / 本地治理文件；AGENTS.md 需带公开标记）
name: structure-guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同 PR 的新推送会取代旧运行的结论；push（main 上的权威记录）不取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  layout:
    name: Layout & hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check repository layout
        run: python scripts/check_layout.py
