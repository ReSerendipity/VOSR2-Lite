name: CI - Desktop Shell (Rust/Tauri)

# 桌面壳（desktop/src-tauri，Tauri v2 / Rust）的机械验证入口：只在壳相关文件变更时触发，
# 与后端质量门禁（ci.yml）并行、互不阻塞。
#
# 为什么单独一条 workflow：ci.yml 只跑 Python（pytest / ruff / mypy），壳的 cargo check /
# clippy / test 从未进入任何门禁——壳编译失败或 clippy 告警会在发布当天才暴露。本 workflow
# 把这层接线补上，并额外校验「版本口径」与「权限镜像」两处静默漂移。
on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/check_shell_version.py'
      - '.github/workflows/desktop-shell.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/check_shell_version.py'
      - '.github/workflows/desktop-shell.yml'

permissions:
  contents: read

concurrency:
  group: desktop-shell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell-check:
    name: Rust clippy + test (windows)
    # runs-on=windows-latest：Cargo.toml 依赖 winreg（Windows 专有），且 Tauri v2 在 Linux 编译
    # 需 webkit2gtk 等系统库，在 CI 里不稳定；Windows runner 自带 WebView2 / Windows SDK。
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # 版本口径：壳版本三处镜像 + minimum_shell_version 语义（见 desktop/README.md「版本口径」）
      - name: Version discipline (shell triad + minimum_shell_version)
        run: python scripts/check_shell_version.py --verbose

      # 安全边界哨兵：capabilities/main.json 里每条自定义权限 allow-<cmd> 必须有对应的
      # tracked 权限镜像 permissions/autogenerated/<cmd>.toml（由 build.rs 的
      # AppManifest::commands 经 tauri-build 生成）。捕获 cargo 自身静默容忍的
      # 「generate_handler 加了命令、build.rs/toml 没跟上」漂移。
      - name: Permission-mirror integrity (capabilities allow-* ↔ tracked autogenerated/*.toml)
        working-directory: desktop/src-tauri
        run: |
          missing=0
          for p in $(grep -oE '"allow-[a-z0-9-]+"' capabilities/main.json | tr -d '"' | sed 's/^allow-//; s/-/_/g' | sort -u); do
            if [ ! -f "permissions/autogenerated/$p.toml" ]; then
              echo "::error::capabilities/main.json 引用了 allow-$(echo "$p" | tr '_' '-')，但 permissions/autogenerated/$p.toml 缺失（未纳入跟踪）"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "PASS: 每条 allow-* 能力都有对应的 tracked 权限镜像文件"
          else
            echo "修复：在 build.rs 的 AppManifest::commands 补上该命令，重新生成并提交 permissions/autogenerated/*.toml"
            exit 1
          fi

      - name: Clippy (cargo clippy --all-targets -- -D warnings)
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test (cargo test)
        working-directory: desktop/src-tauri
        run: cargo test --locked
